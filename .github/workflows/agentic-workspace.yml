name: Agentic Workspace Tests

on:
  push:
    branches:
      - main
      - "feature/agentic-workspace-overlays"
  pull_request:
    branches:
      - main
    paths:
      - "app/agentic_workspace/**"
      - "app/agent/manus_core.py"
      - "tests/test_agentic_workspace.py"
      - "tests/test_openmanus_runtime_client.py"
      - "tests/test_embeddings.py tests/test_vector_rag.py"
      - "tests/test_vector_rag.py"
      - ".github/workflows/agentic-workspace.yml"

permissions:
  contents: read

jobs:
  workspace-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install "fastapi==0.115.11" "pydantic==2.10.6" "httpx>=0.27,<1" "pytest==8.3.5"
      - name: Run workspace contract tests
        run: python -m pytest -q tests/test_agentic_workspace.py tests/test_openmanus_runtime_client.py tests/test_embeddings.py
